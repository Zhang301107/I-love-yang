<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立冬快乐 ❉</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; }
  body { display:flex; justify-content:center; align-items:center;
         font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .photo-card {
    position:absolute; pointer-events:auto; cursor:pointer;
    background:#fff; padding:8px 8px 28px;
    box-shadow:0 6px 22px rgba(255,105,180,.25);
    border-radius:4px; opacity:0;
    animation:photoIn .6s ease-out forwards, photoOut 1.8s ease-in forwards;
    animation-delay: var(--in-delay), var(--out-delay);
    z-index:1;
    transition: left 2.2s cubic-bezier(.4,0,.2,1),
                top 2.2s cubic-bezier(.4,0,.2,1),
                transform 2.2s cubic-bezier(.4,0,.2,1),
                opacity 0.35s ease,
                width 0.4s ease, height 0.4s ease;
  }
  .photo-card img {
    display:block; width:100%; height:100%; object-fit:cover;
    border-radius:2px;
  }
  @keyframes photoIn {
    0%   { opacity:0; transform:scale(.7) rotate(var(--rot)); }
    100% { opacity:1;  transform:scale(1)  rotate(var(--rot)); }
  }
  @keyframes photoOut {
    0%   { opacity:1; }
    100% { opacity:0; transform:scale(.85); }
  }
  .photo-card.breath {
    animation:breathe 1.1s ease-in-out;
  }
  @keyframes breathe {
    0%,100% { transform:scale(1) rotate(var(--rot)); }
    50%     { transform:scale(1.18) rotate(var(--rot)); }
  }
  .photo-card.big {
    transform: scale(1.2);
    z-index: 50;
    box-shadow:0 10px 30px rgba(255,105,180,.45);
  }
  .stage { position:relative; width:min(90vw,420px); height:min(90vw,420px);
           animation:beat 6.7s infinite ease-in-out; z-index:20; }
  @keyframes beat {
    0%,100% { transform:scale(1); }
    12% { transform:scale(1.12); }
    24% { transform:scale(1); }
    36% { transform:scale(1.08); }
    50% { transform:scale(1); }
  }
  .p { position:absolute; color:#ff69b4; pointer-events:none;
       text-shadow:0 0 6px rgba(255,105,180,.9);
       animation:flow 1.5s infinite ease-in-out; }
  @keyframes flow {
    0%,100% { opacity:.35; transform:scale(.75); }
    50%     { opacity:1;   transform:scale(1.25);
              text-shadow:0 0 14px rgba(255,120,200,1); }
  }
  #lidongText {
    position:absolute;
    top:46%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#ff7fc0;
    font-weight:bold;
    white-space:nowrap;
    font-size:clamp(20px,6vw,32px);
    z-index:20;
    text-shadow:0 0 8px #ff69b4,0 0 24px rgba(255,105,180,.7);
    animation:glow 1.4s infinite ease-in-out;
    transition:opacity 0.35s ease;
  }
  #lidongText.hide-me{
    animation:none !important;
    opacity:0 !important;
  }
  @keyframes glow {
    0%,100%{opacity:.9}
    50%{opacity:1; text-shadow:0 0 16px #ff69b4,0 0 40px rgba(255,105,180,.9)}
  }
  .foot { position:absolute; bottom:16px; width:100%; text-align:center;
          color:rgba(255,127,192,.55); font-size:12px; letter-spacing:3px; z-index:20;
          transition: opacity 1s; }
  .photo-card.zoom {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(0)!important;
    width:min(85vw,520px); height:auto;
    padding:10px 10px 36px; z-index:999;
    animation:none; opacity:1;
    box-shadow:0 0 40px rgba(255,105,180,.6);
  }
  .photo-card.zoom img { width:100%; height:auto; }
  /* 汇聚时的照片样式 */
  .photo-card.gather {
    position:fixed !important;
    z-index:100 !important;
    padding:3px !important;
    box-shadow:0 0 12px rgba(255,105,180,.65) !important;
    cursor:default !important;
    animation:none !important; opacity:1 !important;
    transition: left 1.8s cubic-bezier(.5,0,.2,1), top 1.8s cubic-bezier(.5,0,.2,1),
                width 1.0s ease, height 1.0s ease,
                transform 1.0s ease;
  }
  .photo-card.gather img { border-radius:2px; }
  /* 第20秒所有照片放大1倍 */
  .photo-card.gather.scale-up {
    transform: scale(2) !important;
  }
  /* 铺满屏幕 */
  .photo-card.gather.fullscreen-heart {
    width: 11vw !important;
    height: 11vw !important;
  }
  /* 最终爱心整体脉动 */
  .photo-card.gather.final-pulse {
    animation: finalBeat 6.7s infinite ease-in-out !important;
  }
  @keyframes finalBeat {
    0%,100% { transform: scale(1); }
    12% { transform: scale(1.06); }
    24% { transform: scale(1); }
    36% { transform: scale(1.04); }
    50% { transform: scale(1); }
  }
  /* ===== 亚漫，我喜欢你：页面正中间，最上层 ===== */
  .laugh {
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    color:#ff69b4;
    font-weight:bold;
    white-space:nowrap;
    font-size:clamp(30px,9vw,52px);
    letter-spacing:6px;
    z-index:9999;
    opacity:0;
    pointer-events:none;
    text-shadow:0 0 10px #ff69b4,0 0 30px rgba(255,105,180,.85);
  }
  .laugh.show { animation:laughPop 10s ease-out forwards; }
  @keyframes laughPop {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-8deg); }
    5%  { opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(5deg); }
    10%  { opacity:1; transform:translate(-50%,-50%) scale(0.95) rotate(-3deg); }
    14%  { opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(2deg); }
    18%  { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    92%  { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(0.85) rotate(0deg); }
  }
  /* ===== 主体爱心光圈 ===== */
  .halo { position:absolute; left:0; top:0; width:100%; height:100%;
          overflow:visible; pointer-events:none; z-index:1; }
  .halo path { fill:none; stroke-linecap:round; }
  .halo .halo-static { stroke:rgba(255,105,180,.16); stroke-width:1.6;
          filter:drop-shadow(0 0 6px rgba(255,105,180,.5)); }
  .halo .halo-cw { stroke:rgba(255,158,208,.95); stroke-width:2.2;
          stroke-dasharray:5 26;
          animation:dashCW 10.5s linear infinite;
          filter:drop-shadow(0 0 7px rgba(255,105,180,1)); }
  .halo .halo-ccw { stroke:rgba(196,226,255,.85); stroke-width:1.8;
          stroke-dasharray:3 34;
          animation:dashCCW 13.5s linear infinite;
          filter:drop-shadow(0 0 7px rgba(168,210,255,.9)); }
  @keyframes dashCW  { from{stroke-dashoffset:0} to{stroke-dashoffset:-62} }
  @keyframes dashCCW { from{stroke-dashoffset:0} to{stroke-dashoffset:74} }
  /* 沿光圈滑行的小爱心 */
  .flowp { position:absolute; pointer-events:none; color:#ff8fc8; z-index:6;
           transform:translate(-50%,-50%);
           text-shadow:0 0 8px rgba(255,105,180,.95);
           animation:pFlow 2.2s infinite ease-in-out; }
  .flowp.cool { color:#cfe6ff; text-shadow:0 0 8px rgba(168,210,255,.95); }
  @keyframes pFlow {
    0%,100% { opacity:.4;  transform:translate(-50%,-50%) scale(.8); }
    50%     { opacity:1;   transform:translate(-50%,-50%) scale(1.3); }
  }
  /* 雪花+爱心一组上升 */
  .snow-group {
    position:absolute;
    left:0;
    top:0;
    width:0;
    height:0;
    pointer-events:none;
    animation:riseGroup 3.6s linear forwards;
  }
  .snow-group .snow {
    position:absolute;
    color:#fff;
    font-size:inherit;
    text-shadow:0 0 4px rgba(255,255,255,.8);
    transform:translate(-50%,-50%);
  }
  .snow-group .mini-heart {
    position:absolute;
    color:#ff69b4;
    font-size:inherit;
    text-shadow:0 0 6px rgba(255,105,180,.9);
    transform:translate(-50%,-50%);
  }
  @keyframes riseGroup {
    0%   { transform:translateY(0) scale(.5) rotate(-15deg); opacity:0; }
    18%  { opacity:1; }
    75%  { opacity:.7; }
    100% { transform:translateY(-130px) scale(1.3) rotate(15deg); opacity:0; }
  }
</style>
</head>
<body>
<div id="photoLayer"></div>
<div class="stage" id="stage">
  <div id="lidongText">立冬快乐 ❉</div>
</div>
<div class="foot" id="footText">立 · 冬 · 快 · 乐</div>
<div class="laugh" id="laughText">亚漫，我喜欢你</div>
<script>
const stage = document.getElementById('stage');
const photoLayer = document.getElementById('photoLayer');
const footText = document.getElementById('footText');
const lidongText = document.getElementById('lidongText');
const laughText = document.getElementById('laughText');

const PHOTO_COUNT   = 30;
const STAY_MS       = 3000;
const GAP_MS        = 1000;
const GATHER_DELAY  = 20000;
const STOP_NEW_PHOTO_MS = 19000;
const LIDONG_HIDE_MS = 21500;
const LAUGH_AT_MS   = 22000;
const LAUGH_KEEP_MS = 10000;
const LOOP_BACK_MS  = 5000;

const PHOTOS = [];
for(let i = 1; i <= PHOTO_COUNT; i++) PHOTOS.push(i + '.jpg');

function heartXY(t, s){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  return [x*s, y*s];
}

const W = stage.clientWidth, H = stage.clientHeight;
const base = Math.min(W,H)/60;

function makeHeart(px,py,size,delay){
  const s = document.createElement('span');
  s.className='p'; s.textContent = '\u2661';
  s.style.left = px+'px';
  s.style.top  = py+'px';
  s.style.fontSize = size+'px';
  s.style.animationDelay = delay+'s';
  return s;
}

const CX = W/2, CY = H*0.46;
for(let ring=0; ring<2; ring++){
  const s = base*(1+ring*0.16);
  for(let t=0; t<Math.PI*2; t+=0.06){
    const [x,y]=heartXY(t,s);
    const d = Math.sqrt(x*x+y*y)/(base*18);
    stage.appendChild(makeHeart(CX+x, CY+y, 11+Math.random()*7, (d*1.8 + ring*0.45).toFixed(2)));
  }
}

function heartPath(s){
  let p='';
  for(let t=0; t<=Math.PI*2+0.02; t+=0.04){
    const [x,y]=heartXY(t,s);
    p += (p ? 'L' : 'M') + (CX+x).toFixed(1) + ' ' + (CY+y).toFixed(1) + ' ';
  }
  return p + 'Z';
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const halo = document.createElementNS(SVG_NS,'svg');
halo.setAttribute('class','halo');
halo.setAttribute('viewBox','0 0 '+W+' '+H);
halo.innerHTML =
    '<path class="halo-static" d="'+heartPath(base*1.42)+'" />'
  + '<path class="halo-cw"     d="'+heartPath(base*1.42)+'" />'
  + '<path class="halo-static" d="'+heartPath(base*1.62)+'" />'
  + '<path class="halo-ccw"    d="'+heartPath(base*1.62)+'" />';
stage.appendChild(halo);

const flowItems = [];
function addFlow(s, n, dir, cool, period){
  for(let i=0;i<n;i++){
    const el = document.createElement('span');
    el.className = 'flowp' + (cool ? ' cool' : '');
    el.textContent = '\u2661';
    el.style.fontSize = (12+Math.random()*8).toFixed(1)+'px';
    el.style.animationDelay = (Math.random()*2.2).toFixed(2)+'s';
    stage.appendChild(el);
    flowItems.push({el:el, s:s, t:(i/n)*Math.PI*2, dir:dir, period:period});
  }
}
addFlow(base*1.42, 15,  1, false, 18000);
addFlow(base*1.62, 15, -1, true , 24000);

let flowLast = performance.now();
function flowTick(now){
  const dt = Math.min(64, now - flowLast); flowLast = now;
  for(const f of flowItems){
    f.t += f.dir * (Math.PI*2 / f.period) * dt;
    const [x,y] = heartXY(f.t, f.s);
    f.el.style.left = (CX + x)+'px';
    f.el.style.top  = (CY + y)+'px';
  }
  requestAnimationFrame(flowTick);
}
requestAnimationFrame(flowTick);

function spawnSnow(){
  const group = document.createElement('div');
  group.className = 'snow-group';

  const size = 10 + Math.random()*22;
  const x = Math.random()*window.innerWidth;
  const y = window.innerHeight*(0.3 + Math.random()*0.65);

  group.style.left = x + 'px';
  group.style.top  = y + 'px';
  group.style.fontSize = size + 'px';
  group.style.animationDuration = (2.4 + Math.random()*2.4) + 's';

  const snow = document.createElement('span');
  snow.className = 'snow';
  snow.textContent = Math.random()>0.5 ? '\u2744' : '\u2745';
  snow.style.left = '0px';
  snow.style.top  = '0px';

  const heart = document.createElement('span');
  heart.className = 'mini-heart';
  heart.textContent = '\u2661';
  heart.style.fontSize = (size * 0.7).toFixed(1) + 'px';
  heart.style.left = (size * 0.6).toFixed(1) + 'px';
  heart.style.top  = (-size * 0.4).toFixed(1) + 'px';

  group.appendChild(snow);
  group.appendChild(heart);
  document.body.appendChild(group);

  setTimeout(() => group.remove(), 5200);
  setTimeout(spawnSnow, 60 + Math.random()*180);
}
spawnSnow();

let gathering = false;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let seq = [];
const shown = [];
const photoTimers = new Map();

function nextPhotoIndex(){
  if(seq.length === 0){
    seq = shuffle([...Array(PHOTO_COUNT).keys()]);
  }
  return seq.shift();
}

function spawnPhoto(){
  if(gathering) return;

  const now = performance.now();
  if(now >= STOP_NEW_PHOTO_MS) return;

  const idx = nextPhotoIndex();
  const src = PHOTOS[idx];
  const card = document.createElement('div');
  card.className = 'photo-card';

  const size = Math.round((110 + Math.random()*84) * 1.2);
  const rot  = (Math.random()-0.5)*28;
  const x = Math.random()*(window.innerWidth - size - 20) + 10;
  const y = Math.random()*(window.innerHeight - size - 60) + 20;
  const outDelay = (STAY_MS/1000).toFixed(2)+'s';

  card.style.cssText += `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`
    + `--rot:${rot}deg;--in-delay:0s;--out-delay:${outDelay};`;

  const img = document.createElement('img');
  img.src = src; img.alt = '';
  img.onerror = ()=>{ if(card.parentNode && !gathering) card.remove(); };
  card.appendChild(img);

  card.addEventListener('click', ()=>{ if(!gathering) card.classList.toggle('zoom'); });
  photoLayer.appendChild(card);
  shown.push(card);

  if(Math.random() < 0.3){
    const breathDelay = 400 + Math.random()*Math.max(200, STAY_MS - 1600);
    setTimeout(()=>{
      if(card.parentNode && !card.classList.contains('zoom') && !gathering){
        card.classList.add('breath');
        setTimeout(()=> card.classList.remove('breath'), 1100);
      }
    }, breathDelay);
  }

  if(Math.random() < 0.25){
    setTimeout(()=>{
      if(card.parentNode && !card.classList.contains('zoom') && !gathering){
        card.classList.add('big');
        setTimeout(()=>{
          if(card.parentNode) card.classList.remove('big');
        }, 4000);
      }
    }, 600 + Math.random()*800);
  }

  const t1 = setTimeout(()=>{
    if(card.parentNode && !card.classList.contains('zoom') && !gathering) card.remove();
  }, STAY_MS + 1400);

  photoTimers.set(card, t1);

  const nextIn = Math.min(GAP_MS, STOP_NEW_PHOTO_MS - now);
  if(nextIn > 0){
    setTimeout(spawnPhoto, nextIn);
  }
}

spawnPhoto();

function gatherToHeart(){
  gathering = true;
  footText.style.opacity = '0';

  photoTimers.forEach((t)=> clearTimeout(t));
  photoTimers.clear();

  photoLayer.querySelectorAll('.photo-card').forEach(c=>c.remove());
  shown.length = 0;

  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.44;
  const heartScale = Math.min(window.innerWidth, window.innerHeight) * 0.021;
  const targets = [];
  const outer = 18, inner = 12;

  for(let i=0;i<outer;i++){
    const t = (i/outer)*Math.PI*2 - Math.PI/2;
    const [hx,hy]=heartXY(t, heartScale);
    targets.push({x:cx+hx, y:cy+hy});
  }
  for(let i=0;i<inner;i++){
    const t = (i/inner)*Math.PI*2 - Math.PI/2;
    const [hx,hy]=heartXY(t, heartScale*0.58);
    targets.push({x:cx+hx, y:cy+hy});
  }

  const cardSize = Math.max(30, Math.min(46, heartScale*2.2));
  const cards = [];
  for(let i=0;i<PHOTO_COUNT;i++){
    const card = document.createElement('div');
    card.className = 'photo-card gather';
    const sx = Math.random()*window.innerWidth;
    const sy = Math.random()*window.innerHeight;
    card.style.width = cardSize+'px';
    card.style.height = cardSize+'px';
    card.style.left = sx+'px';
    card.style.top = sy+'px';
    card.style.opacity = '1';
    const img = document.createElement('img');
    img.src = PHOTOS[i]; img.alt = '';
    card.appendChild(img);
    photoLayer.appendChild(card);
    cards.push(card);
  }
  void photoLayer.offsetHeight;
  requestAnimationFrame(()=>{
    cards.forEach((card,i)=>{
      const tg = targets[i % targets.length];
      card.style.left = (tg.x - cardSize/2)+'px';
      card.style.top  = (tg.y - cardSize/2)+'px';
    });

    setTimeout(()=>{
      cards.forEach(c=>{
        c.classList.add('scale-up');
        c.classList.add('fullscreen-heart');
        c.classList.add('final-pulse');
      });
    }, 1000);
  });
}
setTimeout(gatherToHeart, GATHER_DELAY);

setTimeout(()=>{
  lidongText.classList.add('hide-me');
}, LIDONG_HIDE_MS);

setTimeout(()=>{
  laughText.classList.add('show');
  setTimeout(()=>{
    laughText.classList.remove('show');
    laughText.style.animation = 'none';
    void laughText.offsetWidth;
    laughText.style.animation = '';
    laughText.classList.remove('show');

    photoLayer.querySelectorAll('.photo-card').forEach(c=>c.remove());
    shown.length = 0;
    gathering = false;

    lidongText.classList.remove('hide-me');
    footText.style.opacity = '1';

    seq = shuffle([...Array(PHOTO_COUNT).keys()]);
    spawnPhoto();
    setTimeout(gatherToHeart, GATHER_DELAY - LOOP_BACK_MS);
    setTimeout(()=>{
      lidongText.classList.add('hide-me');
    }, LIDONG_HIDE_MS - LOOP_BACK_MS);
    setTimeout(loopLaugh, LAUGH_AT_MS - LOOP_BACK_MS);

  }, LAUGH_KEEP_MS);
}, LAUGH_AT_MS);

function loopLaugh(){
  laughText.classList.add('show');
  setTimeout(()=>{
    laughText.classList.remove('show');
    laughText.style.animation = 'none';
    void laughText.offsetWidth;
    laughText.style.animation = '';
    laughText.classList.remove('show');

    photoLayer.querySelectorAll('.photo-card').forEach(c=>c.remove());
    shown.length = 0;
    gathering = false;

    lidongText.classList.remove('hide-me');
    footText.style.opacity = '1';

    seq = shuffle([...Array(PHOTO_COUNT).keys()]);
    spawnPhoto();
    setTimeout(gatherToHeart, GATHER_DELAY - LOOP_BACK_MS);
    setTimeout(()=>{
      lidongText.classList.add('hide-me');
    }, LIDONG_HIDE_MS - LOOP_BACK_MS);
    setTimeout(loopLaugh, LAUGH_AT_MS - LOOP_BACK_MS);

  }, LAUGH_KEEP_MS);
}

</script>
</body>
</html>
