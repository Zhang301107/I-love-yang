<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立冬快乐 ❉</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; }
  body { display:flex; justify-content:center; align-items:center;
         font-family:"PingFang SC","Microsoft YaHei",sans-serif; }

  .photo-card {
    position:absolute; pointer-events:auto; cursor:pointer;
    background:#fff; padding:8px 8px 28px;
    box-shadow:0 6px 22px rgba(255,105,180,.25);
    border-radius:4px; opacity:0;
    animation:photoIn .5s ease-out forwards, photoOut 1.6s ease-in forwards;
    animation-delay: var(--in-delay), var(--out-delay);
    z-index:1;
    transition: left 2.2s cubic-bezier(.4,0,.2,1),
                top 2.2s cubic-bezier(.4,0,.2,1),
                transform 2.2s cubic-bezier(.4,0,.2,1),
                opacity 1.2s ease,
                width 2.2s ease, height 2.2s ease;
  }
  .photo-card img { display:block; width:100%; height:100%; object-fit:cover; border-radius:2px; }
  @keyframes photoIn {
    0%   { opacity:0; transform:scale(.7) rotate(var(--rot)); }
    100% { opacity:1;  transform:scale(1)  rotate(var(--rot)); }
  }
  @keyframes photoOut { 0%{opacity:1;} 100%{opacity:0; transform:scale(.85);} }
  .photo-card.breath { animation:breathe .8s ease-in-out; }
  @keyframes breathe {
    0%,100% { transform:scale(1) rotate(var(--rot)); }
    50%     { transform:scale(1.18) rotate(var(--rot)); }
  }

  .stage { position:relative; width:min(90vw,420px); height:min(90vw,420px);
           animation:beat 1.4s infinite ease-in-out; z-index:20; }
  @keyframes beat {
    0%,100% { transform:scale(1); }
    12% { transform:scale(1.12); }
    24% { transform:scale(1); }
    36% { transform:scale(1.08); }
    50% { transform:scale(1); }
  }

  /* 轮廓流光线粒子：位置固定，亮/暗由 JS 流光扫掠控制 */
  .p { position:absolute; color:#ff69b4; pointer-events:none;
       will-change:opacity,transform; }

  /* 内部填充粒子：保留原地呼吸缩放 */
  .p-fill { position:absolute; color:#ff69b4; pointer-events:none;
       text-shadow:0 0 6px rgba(255,105,180,.9);
       animation:flow 1.0s infinite ease-in-out; }
  @keyframes flow {
    0%,100% { opacity:.35; transform:scale(.75); }
    50%     { opacity:1;   transform:scale(1.25);
              text-shadow:0 0 14px rgba(255,120,200,1); }
  }

  .text { position:absolute; top:46%; left:50%;
          transform:translate(-50%,-50%);
          color:#ff7fc0; font-weight:bold; white-space:nowrap;
          font-size:clamp(20px,6vw,32px); z-index:20;
          text-shadow:0 0 8px #ff69b4,0 0 24px rgba(255,105,180,.7);
          animation:glow 1.4s infinite ease-in-out; }
  @keyframes glow { 0%,100%{opacity:.9} 50%{opacity:1; text-shadow:0 0 16px #ff69b4,0 0 40px rgba(255,105,180,.9)} }

  .bg { position:absolute; color:#fff; opacity:0; pointer-events:none;
        animation:rise 3.6s linear forwards;
        text-shadow:0 0 4px rgba(255,255,255,.8); }
  @keyframes rise {
    0% { transform:translateY(0) scale(.5) rotate(-15deg); opacity:0; }
    18%{ opacity:.9; }
    75%{ opacity:.6; }
    100%{ transform:translateY(-130px) scale(1.3) rotate(15deg); opacity:0; }
  }

  .foot { position:absolute; bottom:16px; width:100%; text-align:center;
          color:rgba(255,127,192,.55); font-size:12px; letter-spacing:3px; z-index:20;
          transition: opacity 1s; }

  .photo-card.zoom {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(0)!important;
    width:min(85vw,520px); height:auto;
    padding:10px 10px 36px; z-index:999;
    animation:none; opacity:1;
    box-shadow:0 0 40px rgba(255,105,180,.6);
  }
  .photo-card.zoom img { width:100%; height:auto; }

  .photo-card.gather {
    position:fixed !important; z-index:100 !important;
    padding:2px !important;
    box-shadow:0 0 12px rgba(255,105,180,.6) !important;
    cursor:default !important;
  }
  .photo-card.gather img { border-radius:50%; }
  .photo-card.gather.final-pulse { animation: finalBeat 1.4s infinite ease-in-out; }
  @keyframes finalBeat {
    0%,100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    12% { transform: translate(-50%,-50%) scale(1.06) rotate(0deg); }
    24% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    36% { transform: translate(-50%,-50%) scale(1.04) rotate(0deg); }
    50% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
</style>
</head>
<body>

<div id="photoLayer"></div>

<div class="stage" id="stage">
  <div class="text">立冬快乐 ❉</div>
</div>
<div class="foot" id="footText">立 · 冬 · 快 · 乐</div>

<script>
const stage = document.getElementById('stage');
const photoLayer = document.getElementById('photoLayer');
const footText = document.getElementById('footText');

const PHOTO_COUNT   = 5;
const MAX_ON_SCREEN = 12;
const STAY_MS       = 1000;          // 照片停留 1s
const SPAWN_INTERVAL= 350;
const GATHER_DELAY  = 20000;         // 第 20 秒汇聚

/* ===== 爱心流动参数（只影响爱心这一部分）===== */
const FLOW_PERIOD = 1.2;             // 光点绕爱心一圈的秒数（顺逆都加快：2.0 -> 1.2，每圈更快）
const FLOW_TRAIL  = 0.13;            // 彗星拖尾长度（占整圈的比例）
const FLOW_COMETS = 10;              // 每个方向的光线条数（顺 10 条 + 逆 10 条）
const FLOW_STAGGER= 0.2;             // 同方向相邻两条光线的出发间隔（秒）（0.4 -> 0.2，出发更密、流水更连贯）
/* ============================================ */

const PHOTOS = [];
for(let i = 1; i <= PHOTO_COUNT; i++) PHOTOS.push(i + '.jpg');

function heartXY(t, s){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  return [x*s, y*s];
}
const W = stage.clientWidth, H = stage.clientHeight;
const base = Math.min(W,H)/40;

const ringDots = [];   // 轮廓流光线粒子

function addRingDot(x,y,size,arcPos){
  const s = document.createElement('span');
  s.className='p'; s.textContent = Math.random()>0.85 ? '❉' : '❤';
  s.style.left = (W/2 + x)+'px';
  s.style.top  = (H*0.46 + y)+'px';
  s.style.fontSize = size+'px';
  s.style.opacity = '.35';
  stage.appendChild(s);
  ringDots.push({ el:s, arcPos });   // arcPos ∈ [0,1) 沿轮廓的归一化位置
}
function addFillDot(x,y,size,delay){
  const s = document.createElement('span');
  s.className='p-fill'; s.textContent = Math.random()>0.85 ? '❉' : '❤';
  s.style.left = (W/2 + x)+'px';
  s.style.top  = (H*0.46 + y)+'px';
  s.style.fontSize = size+'px';
  s.style.animationDelay = delay+'s';
  stage.appendChild(s);
}

/* 轮廓三圈（内/中/外）：位置固定，参与流光扫掠 */
for(let ring=0; ring<3; ring++){
  const s = base*(1+ring*0.09);
  const step = 0.05;
  for(let t=0; t<Math.PI*2; t+=step){
    const [x,y]=heartXY(t,s);
    addRingDot(x,y, 10+Math.random()*8, (t/(Math.PI*2)));
  }
}
/* 内部随机填充：保留呼吸 */
for(let i=0;i<90;i++){
  const t = Math.random()*Math.PI*2, k = Math.pow(Math.random(),0.55);
  const [x,y]=heartXY(t,base*k);
  const d = Math.sqrt(x*x+y*y)/(base*18);
  addFillDot(x,y, 7+Math.random()*7, d*1.2);
}

/* 流光：顺 + 逆双向，每个方向各 FLOW_COMETS 条彗星高光（近白光头 + 粉色拖尾）
   同方向的多条光线之间间隔 FLOW_STAGGER 秒错峰出发 */
const flowT0 = performance.now();
function flowLoop(now){
  // 光头沿轮廓的连续相位（不归一，便于做错峰偏移）
  const basePhase = ((now - flowT0)/1000) / FLOW_PERIOD;
  const phaseGap  = FLOW_STAGGER / FLOW_PERIOD;   // 同方向相邻两条光线的相位差
  for(const d of ringDots){
    let I = 0;
    for(let k=0; k<FLOW_COMETS; k++){
      const ph = basePhase - k*phaseGap;          // 第 k 条光线相对第一条错峰出发
      // 顺时针：back 越大表示光头已扫过越久（拖尾）
      let bCW = (ph - d.arcPos) % 1; if(bCW < 0) bCW += 1;
      if(bCW <= FLOW_TRAIL){
        const i = Math.pow(1 - bCW/FLOW_TRAIL, 1.7);
        if(i > I) I = i;
      }
      // 逆时针：拖尾方向相反
      let bCCW = (d.arcPos - ph) % 1; if(bCCW < 0) bCCW += 1;
      if(bCCW <= FLOW_TRAIL){
        const i = Math.pow(1 - bCCW/FLOW_TRAIL, 1.7);
        if(i > I) I = i;
      }
    }
    const base = 0.34;                       // 未被扫过的轮廓：暗粉常亮
    d.el.style.opacity = (base + (1-base)*I).toFixed(3);
    d.el.style.transform = 'scale(' + (0.80 + 0.55*I).toFixed(3) + ')';
    // 颜色：底色粉 -> 光头近白
    const g = Math.round(105 + 150*I);
    const b = Math.round(180 + 75*I);
    d.el.style.color = 'rgb(255,' + g + ',' + b + ')';
    // 辉光：光头为白核 + 粉晕，越亮辉光越强
    d.el.style.textShadow =
      '0 0 ' + (5+20*I).toFixed(1) + 'px rgba(255,' + g + ',' + b + ',' + (0.55+0.45*I).toFixed(2) + '),' +
      '0 0 ' + (10+34*I).toFixed(1) + 'px rgba(255,' + Math.round(150+60*I) + ',' + Math.round(205+40*I) + ',' + (0.35+0.45*I).toFixed(2) + ')';
  }
  requestAnimationFrame(flowLoop);
}
requestAnimationFrame(flowLoop);

function spawnSnow(){
  const h = document.createElement('div');
  h.className='bg';
  h.textContent = Math.random()>0.5 ? '❄' : '❅';
  h.style.left = Math.random()*window.innerWidth+'px';
  h.style.top  = (window.innerHeight*(0.3+Math.random()*0.65))+'px';
  h.style.fontSize = (10+Math.random()*22)+'px';
  h.style.animationDuration = (2.4+Math.random()*2.4)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 5200);
  setTimeout(spawnSnow, 120+Math.random()*360);
}
spawnSnow();

let queue = [...Array(PHOTO_COUNT).keys()];
let shown = [];
let gathering = false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
shuffle(queue);

function spawnPhoto(){
  if(gathering) return;
  if(shown.length >= MAX_ON_SCREEN){
    const old = shown.shift(); if(old && old.parentNode) old.remove();
  }
  if(queue.length === 0) queue = shuffle([...Array(PHOTO_COUNT).keys()]);
  const idx = queue.pop();
  const src = PHOTOS[idx];

  const card = document.createElement('div');
  card.className = 'photo-card';
  const size = 90 + Math.random()*70;
  const rot  = (Math.random()-0.5)*28;
  const x = Math.random()*(window.innerWidth - size - 20) + 10;
  const y = Math.random()*(window.innerHeight - size - 60) + 20;
  const inDelay  = 0;
  const outDelay = (STAY_MS/1000).toFixed(2)+'s';

  card.style.cssText += `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`
    + `--rot:${rot}deg;--in-delay:${inDelay}s;--out-delay:${outDelay};`;

  const img = document.createElement('img');
  img.src = src; img.alt = 'photo';
  img.onerror = ()=> card.remove();
  card.appendChild(img);

  card.addEventListener('click', ()=> card.classList.toggle('zoom'));
  photoLayer.appendChild(card);
  shown.push(card);

  if(Math.random() < 0.3){
    const breathDelay = 300 + Math.random()*(STAY_MS - 1000);
    setTimeout(()=>{
      if(card.parentNode && !card.classList.contains('zoom') && !gathering){
        card.classList.add('breath');
        setTimeout(()=> card.classList.remove('breath'), 900);
      }
    }, breathDelay);
  }

  setTimeout(()=>{ if(card.parentNode && !card.classList.contains('zoom') && !gathering) card.remove(); }, STAY_MS+1700);
  setTimeout(spawnPhoto, SPAWN_INTERVAL + Math.random()*200);
}
spawnPhoto();

/* ===== 汇聚成爱心（保持不变）===== */
function gatherToHeart(){
  gathering = true;
  footText.style.opacity = '0';

  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.46;
  const heartScale = Math.min(window.innerWidth, window.innerHeight) / 42;

  const currentPhotos = [...photoLayer.querySelectorAll('.photo-card:not(.zoom)')];
  if(currentPhotos.length === 0){
    for(let i = 0; i < 14; i++){
      const card = document.createElement('div');
      card.className = 'photo-card';
      const size = 60 + Math.random()*40;
      const x = Math.random()*(window.innerWidth - size);
      const y = Math.random()*(window.innerHeight - size);
      card.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;opacity:1;`;
      const img = document.createElement('img');
      img.src = PHOTOS[i % PHOTO_COUNT];
      card.appendChild(img);
      photoLayer.appendChild(card);
      currentPhotos.push(card);
    }
  }

  const totalPoints = currentPhotos.length;
  const positions = [];
  const step = (Math.PI * 2) / Math.max(totalPoints, 1);
  for(let i = 0; i < totalPoints; i++){
    const t = i * step;
    const [hx, hy] = heartXY(t, heartScale * 0.55);
    positions.push({ x: cx + hx, y: cy + hy });
  }
  const shuffled = [...positions].sort(()=> Math.random()-0.5);

  currentPhotos.forEach((card, i)=>{
    const target = shuffled[i % shuffled.length];
    const finalSize = Math.max(28, Math.min(55, 320 / Math.sqrt(totalPoints)));
    card.classList.remove('breath');
    card.classList.add('gather');
    card.style.animation = 'none';
    card.style.opacity = '1';
    card.style.width = finalSize + 'px';
    card.style.height = finalSize + 'px';
    card.style.left = target.x - finalSize/2 + 'px';
    card.style.top = target.y - finalSize/2 + 'px';
    card.style.transform = 'rotate(0deg)';
    card.style.zIndex = '100';
  });

  setTimeout(()=>{ currentPhotos.forEach(card => card.classList.add('final-pulse')); }, 2400);
}
setTimeout(gatherToHeart, GATHER_DELAY);
</script>
</body>
</html>
